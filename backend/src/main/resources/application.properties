spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
jwt.secret=${JWT_SECRET:this_is_a_test_jwt_secret_key_which_must_be_very_long_to_be_secure_fittrack_app_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent

# OpenRouter Fallback Configuration
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# Groq Fallback Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# CORS Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}
